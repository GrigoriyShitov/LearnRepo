services:
  gitlab:
    image: gitlab/gitlab-ce:18.6.0-ce.0
    container_name: gitlab
    restart: always
    hostname: gitlab
    ports:
      - '8888:8888'
    volumes:
      - ./configs/gitlab-config.rb:/etc/gitlab/gitlab.rb
      - gitlab-config:/etc/gitlab
      - gitlab-data:/var/opt/gitlab
    mem_limit: 4g
    mem_reservation: 2g

  gitlab-runner:
    image: gitlab/gitlab-runner:alpine3.21
    container_name: gitlab-runner
    restart: always
    network_mode: "host"
    volumes:
      - './gitlab-runner-data:/etc/gitlab-runner'
      - '/var/run/docker.sock:/var/run/docker.sock'
    depends_on:
      - gitlab
    mem_limit: 512m
    mem_reservation: 256m

volumes:
  gitlab-config:
  gitlab-data:
  gitlab-runner-data:
